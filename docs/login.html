(function () {
  /* 已登录则直接去目标页 */
  if (window.BJAuth && BJAuth.session()) { location.replace(BJAuth.safeNext()); return; }

  var $ = function (id) { return document.getElementById(id); };
  var tabIn = $('tabIn'), tabUp = $('tabUp'), form = $('authForm'),
      fUser = $('fUser'), fPass = $('fPass'), fPass2 = $('fPass2'),
      rowConfirm = $('rowConfirm'), rowRemember = $('rowRemember'), fRemember = $('fRemember'),
      err = $('authErr'), btn = $('authGo'), note = $('authNote');
  var mode = 'in';

  function showErr(msg) {
    err.textContent = msg;
    err.hidden = false;
    err.classList.remove('shake');
    void err.offsetWidth;
    err.classList.add('shake');
  }
  function setMode(m) {
    mode = m;
    tabIn.classList.toggle('on', m === 'in');
    tabUp.classList.toggle('on', m === 'up');
    tabIn.setAttribute('aria-selected', m === 'in');
    tabUp.setAttribute('aria-selected', m === 'up');
    rowConfirm.hidden = m !== 'up';
    rowRemember.hidden = m !== 'in';
    fPass.autocomplete = m === 'up' ? 'new-password' : 'current-password';
    btn.textContent = m === 'up' ? '创建账号并进入' : '进入牌桌';
    note.textContent = m === 'up'
      ? '注册后自动登录，账号仅保存在本机浏览器，不上传任何服务器。'
      : '首次使用请先注册账号；账号仅保存在本机浏览器，清除站点数据会同时清除账号与钱包进度。';
    err.hidden = true;
  }
  tabIn.addEventListener('click', function () { setMode('in'); });
  tabUp.addEventListener('click', function () { setMode('up'); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    err.hidden = true;
    if (mode === 'up' && fPass.value !== fPass2.value) { showErr('两次输入的密码不一致'); return; }
    btn.disabled = true;
    btn.textContent = mode === 'up' ? '正在创建账号…' : '正在验证…';
    var p = mode === 'up'
      ? BJAuth.register(fUser.value, fPass.value)
      : BJAuth.login(fUser.value, fPass.value, fRemember.checked);
    p.then(function () { location.replace(BJAuth.safeNext()); })
     .catch(function (msg) {
       showErr(typeof msg === 'string' ? msg : '操作失败，请重试');
       btn.disabled = false;
       btn.textContent = mode === 'up' ? '创建账号并进入' : '进入牌桌';
     });
  });
})();
