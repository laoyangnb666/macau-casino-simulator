<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 澳门娱乐场模拟器</title>
<meta name="description" content="登录澳门娱乐场模拟器：本地账号进入六门 21 点台面与积分商城，账号与进度只保存在本机浏览器，不连接任何真实账户。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
:root{
  --bg:#0A0A0A; --panel:#121214; --line:#232329; --line-2:#2E2E35;
  --txt:#F4F4F5; --txt-2:#A1A1AA; --txt-3:#71717A; --txt-4:#52525B;
  --vio:#8B7CF6; --vio-lt:#A79BFF;
  --sans:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body.loginpage{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body.loginpage [hidden]{display:none!important}
body.loginpage ::selection{background:rgba(139,124,246,.35)}
body.loginpage a:focus-visible,body.loginpage button:focus-visible{outline:2px solid rgba(139,124,246,.6);outline-offset:2px}

/* 顶栏：极简，只留品牌与首页 / 语言 */
.lg-top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px 28px}
.lg-brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.lg-brand img{width:26px;height:26px;border-radius:7px;display:block;object-fit:cover;background:#030a12}
.lg-brand b{font-size:13px;font-weight:600;color:#E4E4E7;letter-spacing:.01em}
.lg-top .nav-links{display:flex;align-items:center;gap:16px}
.lg-top .nav-links a{color:var(--txt-2);text-decoration:none;font-size:12.5px;transition:color .2s}
.lg-top .nav-links a:hover{color:#fff}
body.loginpage .lang-switch{border-color:var(--line-2);color:var(--txt-2)}
body.loginpage .lang-switch:hover{border-color:var(--vio);color:#C4B5FD;background:rgba(139,124,246,.1)}

/* 左表单 / 右圆角大图 */
.lg-split{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);min-height:100vh}
.lg-formwrap{display:flex;align-items:center;justify-content:center;padding:96px 40px 48px}
.lg-form{width:min(450px,100%)}
.lg-badge{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  display:grid;place-items:center;margin-bottom:28px}
.lg-badge img{width:22px;height:22px;border-radius:6px;display:block;object-fit:cover}
.lg-form h1{font-size:clamp(32px,3.4vw,42px);font-weight:500;letter-spacing:-.02em;line-height:1.15;color:#FAFAFA}
.lg-sub{font-size:14.5px;color:var(--txt-2);margin:10px 0 34px}

.lg-field{display:block;margin-bottom:18px}
.lg-field > span{display:block;font-size:12.5px;font-weight:500;color:#E4E4E7;margin-bottom:8px}
.lg-field input{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--txt);font:inherit;font-size:14px;outline:none;color-scheme:dark;
  transition:border-color .2s,box-shadow .2s}
.lg-field input::placeholder{color:var(--txt-3)}
.lg-field input:focus{border-color:var(--vio);box-shadow:0 0 0 3px rgba(139,124,246,.16)}
.lg-passwrap{position:relative}
.lg-passwrap input{padding-right:46px}
.lg-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:9px;
  background:transparent;color:var(--txt-3);cursor:pointer;display:grid;place-items:center;transition:color .18s}
.lg-eye:hover{color:#D4D4D8}

.lg-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 22px}
.lg-check{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;color:var(--txt-2)}
.lg-check input{position:absolute;opacity:0;pointer-events:none}
.lg-check i{width:16px;height:16px;border-radius:4px;border:1px solid #3A3A41;background:var(--panel);
  display:grid;place-items:center;transition:.18s;flex:none}
.lg-check i:after{content:"";width:8px;height:4.5px;border-left:1.6px solid #fff;border-bottom:1.6px solid #fff;
  transform:rotate(-45deg) scale(0);transition:.15s;margin-top:-2px}
.lg-check input:checked + i{background:var(--vio);border-color:var(--vio)}
.lg-check input:checked + i:after{transform:rotate(-45deg) scale(1)}
.lg-check input:focus-visible + i{box-shadow:0 0 0 3px rgba(139,124,246,.25)}
.lg-link{color:var(--vio);text-decoration:none;font-size:12.5px;font-weight:500;transition:color .18s}
.lg-link:hover{color:var(--vio-lt)}
button.lg-link{background:none;border:0;font-family:inherit;cursor:pointer}

.lg-err{margin:0 0 16px;padding:10px 12px;border-radius:10px;border:1px solid rgba(248,113,113,.35);
  background:rgba(248,113,113,.08);color:#FCA5A5;font-size:12px;line-height:1.6}
.lg-err.shake{animation:lgshake .4s}
@keyframes lgshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}55%{transform:translateX(4px)}80%{transform:translateX(-2px)}}

.lg-submit{width:100%;height:50px;border-radius:12px;border:0;cursor:pointer;font:inherit;font-size:14px;font-weight:600;
  letter-spacing:.01em;color:#09090B;background:#F7F7F5;transition:.2s}
.lg-submit:hover:not(:disabled){background:#fff;transform:translateY(-1px);box-shadow:0 10px 30px rgba(255,255,255,.08)}
.lg-submit:disabled{opacity:.6;cursor:wait;transform:none}

.lg-switch{margin-top:26px;text-align:center;font-size:12.5px;color:var(--txt-3)}
.lg-switch .lg-link{margin-left:4px}
.lg-disc{margin-top:18px;text-align:center;font-size:10px;color:var(--txt-4);letter-spacing:.08em}

/* 右侧圆角图 + 底部磨砂卡 */
.lg-art{position:relative;margin:16px 16px 16px 0;border-radius:24px;overflow:hidden;background:#111}
.lg-photo{position:absolute;inset:0;background:url("assets/img/login-hero.jpg") center/cover no-repeat}
.lg-artveil{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 88% 8%,rgba(139,124,246,.16),transparent 62%),
  linear-gradient(180deg,rgba(10,10,10,.12) 0%,rgba(10,10,10,0) 34%,rgba(10,10,10,.42) 100%)}
.lg-cards{position:absolute;left:20px;right:20px;bottom:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lg-glass{padding:16px;border-radius:16px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 18px 40px rgba(0,0,0,.35)}
.lg-glass header{display:flex;align-items:center;gap:10px}
.lg-glass header i{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;
  color:#fff;flex:none;font-style:normal}
.lg-glass header b{display:block;font-size:13px;font-weight:600;color:#fff;line-height:1.3}
.lg-glass header small{display:block;font-size:11px;color:rgba(255,255,255,.65);line-height:1.3}
.lg-glass p{margin-top:9px;font-size:11.5px;color:rgba(255,255,255,.82);line-height:1.62}

@media(max-width:960px){
  .lg-split{grid-template-columns:1fr}
  .lg-formwrap{padding:96px 24px 40px}
  .lg-art{margin:0 16px 16px;min-height:340px}
}
@media(max-width:560px){
  .lg-top{padding:16px 18px}
  .lg-brand b{font-size:12px}
  .lg-formwrap{padding:84px 18px 32px}
  .lg-art{min-height:220px}
  .lg-photo{background-position:68% center}
  .lg-cards{display:none}
}
@media(prefers-reduced-motion:reduce){
  .lg-err.shake{animation:none}
}
</style>
<script src="assets/auth.js"></script>
</head>
<body class="loginpage">

<header class="lg-top">
  <a class="lg-brand" href="index.html">
    <img src="assets/logo.png" alt="澳门娱乐场模拟器" width="26" height="26">
    <b>澳门娱乐场模拟器</b>
  </a>
  <div class="nav-links">
    <a href="index.html">首页</a>
  </div>
</header>

<main class="lg-split">
  <div class="lg-formwrap">
    <div class="lg-form">
      <div class="lg-badge"><img src="assets/logo.png" alt=""></div>
      <h1 id="authTitle">欢迎回来</h1>
      <p class="lg-sub" id="authSub">登录后继续你的牌桌进度与积分。</p>

      <form id="authForm" novalidate>
        <label class="lg-field">
          <span>用户名</span>
          <input id="fUser" type="text" autocomplete="username" maxlength="20" placeholder="2–20 位中文 / 字母 / 数字">
        </label>
        <label class="lg-field">
          <span>密码</span>
          <span class="lg-passwrap">
            <input id="fPass" type="password" autocomplete="current-password" placeholder="至少 6 位">
            <button class="lg-eye" id="eyePass" type="button" aria-label="显示密码">
              <svg id="eyeOn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeOff" hidden width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </span>
        </label>
        <label class="lg-field" id="rowConfirm" hidden>
          <span>确认密码</span>
          <input id="fPass2" type="password" autocomplete="new-password" placeholder="再输入一次">
        </label>
        <div class="lg-row" id="rowRemember">
          <label class="lg-check"><input id="fRemember" type="checkbox" checked><i></i><span>记住我（30 天免登录）</span></label>
          <a class="lg-link" href="index.html">返回首页</a>
        </div>
        <p class="lg-err" id="authErr" hidden></p>
        <button class="lg-submit" id="authGo" type="submit">进入牌桌</button>
      </form>

      <p class="lg-switch"><span id="switchHint">还没有账号？</span><button class="lg-link" id="switchMode" type="button">创建账号</button></p>
      <p class="lg-disc">概率教学模拟 · 虚拟资金 · 未成年人禁止参与赌博</p>
    </div>
  </div>

  <div class="lg-art">
    <div class="lg-photo" role="img" aria-label="私人会所里的绿绒长桌与黄铜台灯"></div>
    <div class="lg-artveil"></div>
    <div class="lg-cards">
      <div class="lg-glass">
        <header>
          <i><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></i>
          <div><b>本地账号</b><small>只存本机 · 不联网</small></div>
        </header>
        <p>记住我 30 天，不勾 12 小时；清除站点数据连钱包一起重置。</p>
      </div>
      <div class="lg-glass">
        <header>
          <i><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 12l-6.1 3.2L12 21l-1.9-5.8L4 12l6.1-3.2z"/></svg></i>
          <div><b>会员权益</b><small>六套会籍 · 21 家场馆</small></div>
        </header>
        <p>六门 21 点按法定规章复刻；积分商城 200+ 项礼遇按官网目录兑换。</p>
      </div>
    </div>
  </div>
</main>

<script src="assets/i18n.js"></script>
<script>
/* 登录页词条（在 i18n 启动前注册） */
if (window.I18N) I18N.extend({
  dict: {
    '登录 · 澳门娱乐场模拟器': 'Sign in · Macau Casino Simulator',
    '欢迎回来': 'Welcome back',
    '登录后继续你的牌桌进度与积分。': 'Sign in to pick up your table progress and points.',
    '开个账号': 'Create your account',
    '账号只写在这台设备的浏览器里，不上传。': 'The account is written only into this browser on this device — nothing is uploaded.',
    '用户名': 'Username', '密码': 'Password', '确认密码': 'Confirm password',
    '2–20 位中文 / 字母 / 数字': '2–20 chars: Chinese, letters, digits',
    '至少 6 位': 'At least 6 characters', '再输入一次': 'Repeat the password',
    '显示密码': 'Show password', '隐藏密码': 'Hide password',
    '记住我（30 天免登录）': 'Keep me signed in (30 days)',
    '返回首页': 'Back to home',
    '进入牌桌': 'Sign in', '创建账号并进入': 'Create account',
    '正在验证…': 'Verifying…', '正在创建账号…': 'Creating account…',
    '还没有账号？': 'New here?', '已有账号？': 'Already have an account?',
    '创建账号': 'Create account', '登录': 'Sign in',
    '本地账号': 'Local account', '只存本机 · 不联网': 'This device only · offline',
    '记住我 30 天，不勾 12 小时；清除站点数据连钱包一起重置。':
      '30 days with "keep me", 12 hours without; clearing site data resets the wallet too.',
    '会员权益': 'Member benefits', '六套会籍 · 21 家场馆': 'Six programmes · 21 casinos',
    '六门 21 点按法定规章复刻；积分商城 200+ 项礼遇按官网目录兑换。':
      'Six-seat blackjack rebuilt from the Macau statute; 200+ rewards redeemed from the official catalogues.',
    '概率教学模拟 · 虚拟资金 · 未成年人禁止参与赌博': 'Educational simulation · virtual funds · no under-18s',
    '两次输入的密码不一致': 'Passwords do not match',
    '用户名需 2–20 位，可用中文、字母、数字、下划线': 'Username must be 2–20 characters (Chinese, letters, digits, underscore)',
    '密码至少 6 位': 'Password must be at least 6 characters',
    '该用户名已被注册': 'That username is already taken',
    '账号不存在，请先注册': 'No such account — please create one first',
    '密码不正确': 'Incorrect password',
    '浏览器存储不可用，无法注册': 'Browser storage unavailable — cannot register',
    '浏览器存储不可用，无法登录': 'Browser storage unavailable — cannot sign in',
    '操作失败，请重试': 'Something went wrong — please retry'
  }
});

(function () {
  /* 已登录则直接去目标页 */
  if (window.BJAuth && BJAuth.session()) { location.replace(BJAuth.safeNext()); return; }

  var $ = function (id) { return document.getElementById(id); };
  var form = $('authForm'), fUser = $('fUser'), fPass = $('fPass'), fPass2 = $('fPass2'),
      rowConfirm = $('rowConfirm'), rowRemember = $('rowRemember'), fRemember = $('fRemember'),
      err = $('authErr'), btn = $('authGo'), title = $('authTitle'), sub = $('authSub'),
      switchHint = $('switchHint'), switchMode = $('switchMode'),
      eye = $('eyePass'), eyeOn = $('eyeOn'), eyeOff = $('eyeOff');
  var mode = 'in';

  function showErr(msg) {
    err.textContent = msg;
    err.hidden = false;
    err.classList.remove('shake');
    void err.offsetWidth;
    err.classList.add('shake');
  }
  function setMode(m) {
    mode = m;
    rowConfirm.hidden = m !== 'up';
    rowRemember.hidden = m !== 'in';
    fPass.autocomplete = m === 'up' ? 'new-password' : 'current-password';
    title.textContent = m === 'up' ? '开个账号' : '欢迎回来';
    sub.textContent = m === 'up' ? '账号只写在这台设备的浏览器里，不上传。' : '登录后继续你的牌桌进度与积分。';
    btn.textContent = m === 'up' ? '创建账号并进入' : '进入牌桌';
    switchHint.textContent = m === 'up' ? '已有账号？' : '还没有账号？';
    switchMode.textContent = m === 'up' ? '登录' : '创建账号';
    err.hidden = true;
  }
  switchMode.addEventListener('click', function () { setMode(mode === 'in' ? 'up' : 'in'); });

  eye.addEventListener('click', function () {
    var show = fPass.type === 'password';
    fPass.type = show ? 'text' : 'password';
    eyeOn.hidden = show;
    eyeOff.hidden = !show;
    eye.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    fPass.focus();
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    err.hidden = true;
    if (mode === 'up' && fPass.value !== fPass2.value) { showErr('两次输入的密码不一致'); return; }
    btn.disabled = true;
    btn.textContent = mode === 'up' ? '正在创建账号…' : '正在验证…';
    var p = mode === 'up'
      ? BJAuth.register(fUser.value, fPass.value)
      : BJAuth.login(fUser.value, fPass.value, fRemember.checked);
    p.then(function () { location.replace(BJAuth.safeNext()); })
     .catch(function (msg) {
       showErr(typeof msg === 'string' ? msg : '操作失败，请重试');
       btn.disabled = false;
       btn.textContent = mode === 'up' ? '创建账号并进入' : '进入牌桌';
     });
  });
})();
</script>
</body>
</html>
